name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Einsdream APK v2.1.0
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile-app
        run: npm install

      - name: Install Expo CLI
        run: npm install -g @expo/cli@latest

      - name: Prebuild Android project
        working-directory: mobile-app
        env:
          EXPO_NO_TELEMETRY: 1
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK (no keystore needed)
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test
          echo "Build complete. Looking for APK..."
          find . -name "*.apk" -type f

      - name: Copy APK to public folder
        run: |
          APK=$(find mobile-app/android -name "*.apk" -type f | head -1)
          echo "Found APK: $APK"
          cp "$APK" public/einsdream-mobile.apk
          ls -lh public/einsdream-mobile.apk

      - name: Commit updated APK
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/einsdream-mobile.apk
          git diff --staged --quiet && echo "No changes" || (git commit -m "chore(apk): auto-build APK v2.1.0 local-recordings-player [skip ci]" && git push)

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: einsdream-v2.1.0
          path: public/einsdream-mobile.apk
          retention-days: 30