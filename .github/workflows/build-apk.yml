name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Einsdream APK v2.1.1
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: mobile-app
        run: |
          npm install

      - name: Bundle Official Expo Hermes Bytecode v2.1.1
        working-directory: mobile-app
        run: |
          mkdir -p ../public/assets

          # Generate Hermes bytecode bundle with official Expo CLI (babel-preset-expo included)
          npx expo export:embed \
            --platform android \
            --dev false \
            --bundle-output ../public/assets/index.android.bundle \
            --bytecode

          echo "=== Bundle verification ==="
          ls -lh ../public/assets/index.android.bundle
          od -t x1 -N 8 ../public/assets/index.android.bundle

          # Verify bundle was generated
          test -s ../public/assets/index.android.bundle

      - name: Inject Hermes Bytecode into APK & Re-sign with apksigner
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "Using Android build-tools: $BUILD_TOOLS"

          cd public
          
          # 1. Update assets/index.android.bundle inside APK UNCOMPRESSED (-0) for Hermes mmap
          zip -0 -u einsdream-mobile.apk assets/index.android.bundle
          
          # Verify bundle is stored uncompressed
          python3 -c "import zipfile; z=zipfile.ZipFile('einsdream-mobile.apk'); e=z.getinfo('assets/index.android.bundle'); print('Bundle compressed:', e.compress_size, 'raw:', e.file_size); assert e.compress_size == e.file_size, 'Bundle must be uncompressed for Hermes mmap!'"

          # 2. Patch AndroidManifest.xml and app.config to version 2.1.0
          python3 ../scripts/patch_apk_metadata.py einsdream-mobile.apk

          # 3. Assert critical Kotlin coroutines services are intact
          python3 -c "import zipfile; z=zipfile.ZipFile('einsdream-mobile.apk'); assert 'META-INF/services/kotlinx.coroutines.internal.MainDispatcherFactory' in z.namelist(), 'CRITICAL: MainDispatcherFactory missing!'"

          # 3. Remove old signature files ONLY (never touch META-INF/services!)
          zip -d einsdream-mobile.apk "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" 2>/dev/null || true
          
          # 4. Create keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Einsdream,O=Einsdream,C=CL"
          
          # 5. Zipalign
          "$BUILD_TOOLS/zipalign" -f -v 4 einsdream-mobile.apk einsdream-mobile-aligned.apk
          
          # 6. Sign
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out einsdream-mobile.apk einsdream-mobile-aligned.apk
          
          # 7. Final verification
          "$BUILD_TOOLS/apksigner" verify -v einsdream-mobile.apk
          python3 -c "import zipfile; z=zipfile.ZipFile('einsdream-mobile.apk'); assert 'META-INF/services/kotlinx.coroutines.internal.MainDispatcherFactory' in z.namelist(), 'CRITICAL: MainDispatcherFactory was lost after signing!'"
          
          # 8. Cleanup
          rm -f debug.keystore einsdream-mobile-aligned.apk
          rm -rf assets
          
          echo "=== Final APK ==="
          ls -lh einsdream-mobile.apk

      - name: Commit & Push new APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Copy versioned copy
          cp public/einsdream-mobile.apk public/einsdream-mobile-v2.1.1.apk
          git add public/einsdream-mobile.apk public/einsdream-mobile-v2.1.1.apk
          # Always commit (--allow-empty handles case where binary is identical)
          git commit --allow-empty -m "chore(apk): update einsdream-mobile.apk Hermes bytecode v2.1.1 [skip actions]"
          git push origin main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: einsdream-mobile-v2.1.1
          path: public/einsdream-mobile.apk
          retention-days: 30