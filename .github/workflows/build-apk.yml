name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Einsdream APK v2.1.0
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        working-directory: mobile-app
        run: |
          npm install

      - name: Bundle New App.js v2.1.0 with Metro
        working-directory: mobile-app
        run: |
          mkdir -p ../public/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output ../public/assets/index.android.bundle

          echo "Generated JS bundle size:"
          ls -lh ../public/assets/index.android.bundle

      - name: Compile to Hermes Bytecode
        run: |
          HERMESC=$(find mobile-app/node_modules -name "hermesc" -type f | head -1)
          if [ -z "$HERMESC" ]; then
            echo "hermesc not found, installing hermes-engine..."
            cd mobile-app && npm install -D hermes-engine && cd ..
            HERMESC=$(find mobile-app/node_modules -name "hermesc" -type f | head -1)
          fi
          
          echo "Found hermesc at: $HERMESC"
          chmod +x "$HERMESC"
          "$HERMESC" -version || true

          # Convert JS bundle to Hermes Bytecode
          "$HERMESC" -emit-binary -out public/assets/index.android.bundle public/assets/index.android.bundle

          echo "Compiled Hermes bytecode size and header:"
          ls -lh public/assets/index.android.bundle
          od -t x1 -N 16 public/assets/index.android.bundle

      - name: Inject Hermes Bytecode into APK & Re-sign with apksigner
        run: |
          BUILD_TOOLS=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "Using Android build-tools: $BUILD_TOOLS"

          cd public
          
          # 1. Update assets/index.android.bundle inside APK UNCOMPRESSED (-0) for Hermes mmap
          zip -0 -u einsdream-mobile.apk assets/index.android.bundle
          
          # Verify bundle is stored uncompressed for Android NDK AAsset_getBuffer()
          python3 -c "import zipfile; z=zipfile.ZipFile('einsdream-mobile.apk'); e=z.getinfo('assets/index.android.bundle'); print('Bundle compressed:', e.compress_size, 'raw:', e.file_size); assert e.compress_size == e.file_size, 'Bundle must be uncompressed for Hermes mmap!'"

          # 2. Update app.config version to 2.1.0 if exists
          unzip -p einsdream-mobile.apk assets/app.config > assets/app.config 2>/dev/null || true
          if [ -f assets/app.config ]; then
            sed -i 's/"version":"[^"]*"/"version":"2.1.0"/g' assets/app.config
            zip -u einsdream-mobile.apk assets/app.config
          fi

          # 3. Remove old signature manifests
          zip -d einsdream-mobile.apk "META-INF/*" || true
          
          # 4. Create Android debug keystore
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Einsdream,O=Einsdream,C=CL"
          
          # 5. Zipalign the APK
          "$BUILD_TOOLS/zipalign" -f -v 4 einsdream-mobile.apk einsdream-mobile-aligned.apk
          
          # 6. Sign with apksigner (v1, v2, v3 schemes enabled by default)
          "$BUILD_TOOLS/apksigner" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out einsdream-mobile.apk einsdream-mobile-aligned.apk
          
          # 7. Verify signature
          "$BUILD_TOOLS/apksigner" verify -v --print-certs einsdream-mobile.apk
          
          # Clean up temporary artifacts
          rm -rf debug.keystore einsdream-mobile-aligned.apk assets
          
          echo "Final APK details:"
          ls -lh einsdream-mobile.apk

      - name: Commit & Push new APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/einsdream-mobile.apk
          git commit -m "chore(apk): update public/einsdream-mobile.apk with Hermes bytecode v2.1.0 [skip ci]"
          git push origin main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: einsdream-mobile-v2.1.0
          path: public/einsdream-mobile.apk
          retention-days: 30