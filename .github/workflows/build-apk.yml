name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Einsdream APK v2.1.0
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: mobile-app
        run: |
          npm install

      - name: Prebuild Android native project
        working-directory: mobile-app
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: |
          npx expo prebuild --platform android --no-install --clean

      - name: Build Android APK (Debug)
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test

      - name: Locate and update public APK
        run: |
          APK=$(find mobile-app/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            echo "Searching whole repo for apk..."
            APK=$(find . -name "*.apk" -type f | grep -v "public/einsdream-mobile.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: No generated APK found!"
            exit 1
          fi
          echo "Found generated APK: $APK"
          mkdir -p public
          cp "$APK" public/einsdream-mobile.apk
          echo "Updated public/einsdream-mobile.apk:"
          ls -lh public/einsdream-mobile.apk

      - name: Commit & Push new APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/einsdream-mobile.apk
          if git diff --staged --quiet; then
            echo "No changes to commit in public/einsdream-mobile.apk"
          else
            git commit -m "chore(apk): update public/einsdream-mobile.apk to v2.1.0 with local recordings player [skip ci]"
            git push origin main
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: einsdream-mobile-v2.1.0
          path: public/einsdream-mobile.apk
          retention-days: 30