name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Einsdream APK v2.1.0
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      _JAVA_OPTIONS: "-Xmx6g -XX:+UseG1GC"
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Install dependencies
        working-directory: mobile-app
        run: |
          npm install

      - name: Prebuild Android native project
        working-directory: mobile-app
        env:
          EXPO_NO_TELEMETRY: 1
          CI: 1
        run: |
          npx expo prebuild --platform android --no-install --clean

      - name: Fix Compose & Kotlin Compatibility & Build APK
        working-directory: mobile-app/android
        run: |
          # 1. Replace 1.9.24 with 1.9.25 across android and node_modules
          find .. -name "*.gradle" -exec sed -i 's/1\.9\.24/1.9.25/g' {} +
          find .. -name "gradle.properties" -exec sed -i 's/1\.9\.24/1.9.25/g' {} +
          
          # 2. Add Compose compiler suppression argument to root build.gradle
          cat << 'EOF' >> build.gradle

          allprojects {
              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions {
                      freeCompilerArgs += [
                          "-P",
                          "plugin:androidx.compose.compiler.plugins.kotlin:suppressKotlinVersionCompatibilityCheck=true"
                      ]
                  }
              }
          }
          EOF

          echo "kotlinVersion=1.9.25" >> gradle.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x lint -x test

      - name: Locate and update public APK
        run: |
          echo "Locating built APK..."
          APK=$(find mobile-app/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" -type f | grep -v "public/einsdream-mobile.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: No generated APK found!"
            exit 1
          fi
          echo "Found generated APK: $APK"
          mkdir -p public
          cp -f "$APK" public/einsdream-mobile.apk
          echo "Updated public/einsdream-mobile.apk size and info:"
          ls -lh public/einsdream-mobile.apk

      - name: Commit & Push new APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/einsdream-mobile.apk
          git commit -m "chore(apk): update public/einsdream-mobile.apk to v2.1.0 with local player [skip ci]"
          git push origin main

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: einsdream-mobile-v2.1.0
          path: public/einsdream-mobile.apk
          retention-days: 30